        function getXPForNextLevel(level) {
            return 200 + (level - 1) * 100;
        }

        function getLevelData(totalXP) {
            let currentLevel = 1;
            let xpAcc = totalXP;
            
            while (currentLevel < 50) {
                let xpNeededForNext = getXPForNextLevel(currentLevel);
                if (xpAcc >= xpNeededForNext) {
                    xpAcc -= xpNeededForNext;
                    currentLevel++;
                } else {
                    break;
                }
            }

            let xpForNextLevel = currentLevel < 50 ? getXPForNextLevel(currentLevel) : 0;
            let rankObj = medicalRanks.find(r => currentLevel >= r.minLevel && currentLevel <= r.maxLevel) || medicalRanks[medicalRanks.length - 1];

            let pct = currentLevel < 50 ? Math.min(100, Math.round((xpAcc / xpForNextLevel) * 100)) : 100;
            let xpNeeded = currentLevel < 50 ? (xpForNextLevel - xpAcc) : 0;

            return {
                level: currentLevel,
                rankName: rankObj.name,
                currentLevelXP: xpAcc,
                totalLevelXP: xpForNextLevel,
                xpNeeded: xpNeeded,
                pct: pct
            };
        }

        function checkAndUpdateStreak() {
            const today = new Date().toISOString().split('T')[0];
            const lastActive = localStorage.getItem("eunacom_pro_last_active_date");
            let streak = parseInt(localStorage.getItem("eunacom_pro_streak") || "1");

            if (!lastActive) {
                localStorage.setItem("eunacom_pro_last_active_date", today);
                localStorage.setItem("eunacom_pro_streak", "1");
                return 1;
            }

            if (lastActive === today) {
                return streak;
            }

            const lastDate = new Date(lastActive);
            const currentDate = new Date(today);
            const diffTime = Math.abs(currentDate - lastDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 1) {
                streak += 1;
                localStorage.setItem("eunacom_pro_streak", streak.toString());
                localStorage.setItem("eunacom_pro_last_active_date", today);
            } else if (diffDays > 1) {
                streak = 1;
                localStorage.setItem("eunacom_pro_streak", "1");
                localStorage.setItem("eunacom_pro_last_active_date", today);
            }
            return streak;
        }

        function initRoscoGame(specFilter = "todas") {
            let baseItems = defaultRoscoItems;
            if (specFilter !== "todas") {
                baseItems = defaultRoscoItems.filter(i => i.specialty === specFilter);
                if (baseItems.length === 0) baseItems = defaultRoscoItems;
            }
            state.roscoItems = baseItems.map(i => ({
                ...i,
                status: "pending",
                userSelected: null
            }));
            state.roscoCurrentIdx = 0;
            state.roscoState = "playing";
            saveRoscoState();
            render();
        }

        function findNextRoscoIndex(fromIdx) {
            const total = state.roscoItems.length;
            for (let i = 1; i <= total; i++) {
                const checkIdx = (fromIdx + i) % total;
                if (state.roscoItems[checkIdx].status === "pending") {
                    return checkIdx;
                }
            }
            for (let i = 1; i <= total; i++) {
                const checkIdx = (fromIdx + i) % total;
                if (state.roscoItems[checkIdx].status === "skipped") {
                    return checkIdx;
                }
            }
            return -1;
        }

        function handleRoscoOptionSelect(optText) {
            const currentItem = state.roscoItems[state.roscoCurrentIdx];
            if (!currentItem || currentItem.status === "correct" || currentItem.status === "wrong") return;

            currentItem.userSelected = optText;
            if (optText === currentItem.correctAnswer) {
                currentItem.status = "correct";
                addRewards(5, "Acierto Rosco");
            } else {
                currentItem.status = "wrong";
                showNotification(`Error en letra ${currentItem.letter}. 🔴`, "warning");
            }

            saveRoscoState();

            const nextIdx = findNextRoscoIndex(state.roscoCurrentIdx);
            if (nextIdx === -1) {
                state.roscoState = "summary";
                addRewards(20, "Completar el Rosco MediPalabra");
            } else {
                state.roscoCurrentIdx = nextIdx;
            }
            render();
        }

        function handleRoscoSkip() {
            const currentItem = state.roscoItems[state.roscoCurrentIdx];
            if (!currentItem) return;

            currentItem.status = "skipped";
            saveRoscoState();

            const nextIdx = findNextRoscoIndex(state.roscoCurrentIdx);
            if (nextIdx === -1) {
                state.roscoState = "summary";
                addRewards(20, "Completar el Rosco MediPalabra");
            } else {
                state.roscoCurrentIdx = nextIdx;
            }
            render();
        }

        function getRoscoCoords(index, total) {
            const radius = 135;
            const centerX = 175;
            const centerY = 175;
            const angle = (2 * Math.PI * index / total) - (Math.PI / 2);
            const x = centerX + radius * Math.cos(angle);
            const y = centerY + radius * Math.sin(angle);
            return { x, y };
        }

                            <div class="flex flex-col sm:flex-row gap-4 items-center justify-between border-t border-cyan-100 pt-6">
                                <div class="w-full sm:w-auto flex-1 max-w-xs">
                                    <label class="text-[10px] font-black uppercase text-slate-400 block mb-1">Especialidad para el Desafío:</label>
                                    <select onchange="state.diagSpecialty=this.value;" class="w-full px-4 py-2.5 bg-white border border-cyan-200 rounded-xl text-xs font-bold text-slate-800">
                                        <option value="aleatorio" ${state.diagSpecialty === 'aleatorio' ? 'selected' : ''}>🎲 Tema Aleatorio de Medicina (Predeterminado)</option>
                                        ${Object.entries(specialtyLabels).map(([k, label]) => `<option value="${k}" ${state.diagSpecialty === k ? 'selected' : ''}>${label}</option>`).join('')}
                                    </select>
                                </div>
                                <button onclick="startDiagMinutoChallenge(state.diagSpecialty)" class="w-full sm:w-auto px-8 py-3.5 bg-cyan-500 hover:bg-cyan-600 text-white font-black text-sm rounded-2xl shadow-lg shadow-cyan-200">Comenzar desafío 🚀</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (state.activeTab === "diag_minuto" && (state.diagState === "playing" || state.diagState === "revealed")) {
                const c = state.diagCurrentCase || diagMinutoFallback[0];
                const isRevealed = state.diagState === "revealed";

                html += `
                    <div class="flex flex-col gap-6 animate-fadeIn max-w-3xl mx-auto">
                        <div class="flex items-center gap-4">
                            <span id="timer-text" class="text-sm font-extrabold text-cyan-600 w-10 flex-shrink-0">${state.diagTimerLeft}s</span>
                            <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
                                <div id="timer-bar-fill" class="h-full bg-cyan-500 transition-all duration-1000" style="width: ${(state.diagTimerLeft / 60) * 100}%;"></div>
                            </div>
                        </div>

                        <div class="bg-slate-100/80 border border-slate-200 rounded-2xl p-6 text-center shadow-sm">
                            <span class="text-[10px] font-black uppercase text-cyan-600 bg-cyan-50 px-2.5 py-1 rounded-full border border-cyan-100 inline-block mb-3">Area: ${specialtyLabels[c.specialty] || "Medicina General"}</span>
                            <h3 class="text-base md:text-lg font-black text-slate-800 leading-snug">${c.mainPrompt}</h3>
                        </div>

                        <div class="flex flex-col gap-3">
                            <span class="text-[10px] font-black uppercase tracking-wider text-slate-400">PISTAS</span>
                            ${[1,2,3,4,5].map(num => `
                                <div class="flex items-center gap-3">
                                    <button onclick="toggleClue(${num})" class="w-10 h-10 rounded-xl border flex items-center justify-center text-base flex-shrink-0 transition-all ${state.diagCluesRevealed[num] ? 'bg-emerald-50 border-emerald-300 text-emerald-600' : 'bg-white border-slate-200 text-slate-400'}">
                                        ${state.diagCluesRevealed[num] ? '🙈' : '👁️'}
                                    </button>
                                    <div class="w-full p-3.5 rounded-xl border text-xs leading-relaxed transition-all ${state.diagCluesRevealed[num] ? 'bg-emerald-50/60 border-emerald-200 text-emerald-950 font-medium' : 'bg-slate-100/70 border-slate-200 text-slate-500'}">
                                        ${state.diagCluesRevealed[num] ? c.pistas[`pista${num}`] : `Pista ${num}: Hallazgos`}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        ${!isRevealed ? `
                            <div class="flex flex-col items-center gap-3 mt-4">
                                <button onclick="revealDiagAnswer()" class="w-full max-w-md py-3.5 bg-cyan-500 text-white font-black text-sm rounded-2xl shadow-lg shadow-cyan-100 text-center">Ver respuesta</button>
                                <button onclick="startDiagMinutoChallenge(state.diagSpecialty)" class="text-xs font-bold text-slate-500 hover:underline">Saltar</button>
                            </div>
                        ` : `
                            <div class="flex flex-col items-center gap-5 mt-4 animate-fadeIn">
                                <div class="w-full p-5 bg-white border-2 border-cyan-400 rounded-3xl shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div>
                                        <span class="text-[10px] font-extrabold uppercase text-cyan-600 tracking-wider block">RESPUESTA CORRECTA</span>
                                        <h4 class="text-xl font-black text-slate-900 mt-1">${c.correctDiagnosis}</h4>
                                    </div>
                                    <button onclick="state.showKeyInfoModal=true; render();" class="px-5 py-2.5 bg-cyan-500 text-white font-bold rounded-2xl text-xs flex items-center gap-2 shadow-md"><span>ℹ️</span><span>Información clave</span></button>
                                </div>

                                <div class="flex flex-col items-center gap-3 w-full max-w-md">
                                    <span class="text-xs font-black text-slate-700">¿La sabías?</span>
                                    <div class="grid grid-cols-2 gap-4 w-full">
                                        <button onclick="handleDiagUserSelfEval(false)" class="py-3 px-4 bg-white border-2 border-rose-500 text-rose-600 font-extrabold text-xs rounded-2xl">No la sabía</button>
                                        <button onclick="handleDiagUserSelfEval(true)" class="py-3 px-4 bg-emerald-600 text-white font-extrabold text-xs rounded-2xl shadow-lg">Sí, la sabía (+10 XP)</button>
                                    </div>
                                </div>
                            </div>
                        `}
                    </div>
                `;
            }

            // TAB: MEDIPALABRA (ROSCO PASAPALABRA EUNACOM)
            if (state.activeTab === "medipalabra") {
                const totalRosco = state.roscoItems.length;
                const correctCount = state.roscoItems.filter(i => i.status === "correct").length;

                if (state.roscoState === "intro") {
                    html += `
                        <div class="flex flex-col gap-6 animate-fadeIn max-w-4xl mx-auto">
                            <div class="bg-gradient-to-r from-indigo-900 via-indigo-800 to-blue-900 text-white rounded-3xl p-6 md:p-8 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                                <div>
                                    <span class="bg-indigo-500/30 text-indigo-200 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider inline-block mb-2">Entrenamiento de Memorización Activa</span>
                                    <h2 class="text-2xl font-black">MediPalabra - El Rosco EUNACOM</h2>
                                    <p class="text-xs text-indigo-200 mt-1 max-w-xl leading-relaxed">Pon a prueba tu vocabulario médico y velocidad conceptual con el mítico formato "Pasapalabra". Selecciona entre 4 alternativas por letra.</p>
                                </div>
                            </div>

                            <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-sm flex flex-col gap-6">
                                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div>
                                        <h3 class="text-lg font-black text-slate-900">Configuración del Rosco</h3>
                                    </div>
                                    <div class="w-full md:w-auto flex items-center gap-3">
                                        <select onchange="state.roscoSpecialtyFilter=this.value;" class="px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-slate-700">
                                            <option value="todas">Todas las Especialidades</option>
                                            ${Object.entries(specialtyLabels).map(([k, label]) => `<option value="${k}" ${state.roscoSpecialtyFilter === k ? 'selected' : ''}>${label}</option>`).join('')}
                                        </select>
                                        <button onclick="initRoscoGame(state.roscoSpecialtyFilter)" class="px-6 py-2.5 bg-indigo-600 text-white font-black text-xs rounded-xl shadow-lg">Iniciar Rosco 🚀</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (state.roscoState === "playing") {
                    const currentItem = state.roscoItems[state.roscoCurrentIdx];

                    html += `
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center animate-fadeIn max-w-6xl mx-auto">
                            <div class="lg:col-span-5 flex flex-col items-center justify-center">
                                <div class="relative w-80 h-80 md:w-96 md:h-96">
                                    <svg viewBox="0 0 350 350" class="w-full h-full">
                                        <circle cx="175" cy="175" r="110" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
                                        <text x="175" y="150" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">ROSCO EUNACOM</text>
                                        <text x="175" y="180" text-anchor="middle" font-size="32" font-weight="900" fill="#0284c7">${currentItem ? currentItem.letter : 'A'}</text>
                                        <text x="175" y="205" text-anchor="middle" font-size="11" font-weight="700" fill="#10b981">${correctCount} Aciertos</text>

                                        ${state.roscoItems.map((item, idx) => {
                                            const coords = getRoscoCoords(idx, totalRosco);
                                            const isCurrent = idx === state.roscoCurrentIdx;
                                            
                                            let fillColor = "#cbd5e1";
                                            let textColor = "#334155";

                                            if (item.status === "correct") { fillColor = "#10b981"; textColor = "#ffffff"; }
                                            else if (item.status === "wrong") { fillColor = "#f43f5e"; textColor = "#ffffff"; }
                                            else if (item.status === "skipped") { fillColor = "#f59e0b"; textColor = "#ffffff"; }
                                            else if (isCurrent) { fillColor = "#06b6d4"; textColor = "#ffffff"; }

                                            return `
                                                <g class="transition-all duration-300 cursor-pointer" onclick="state.roscoCurrentIdx=${idx}; render();">
                                                    <circle cx="${coords.x}" cy="${coords.y}" r="${isCurrent ? 18 : 15}" fill="${fillColor}" stroke="${isCurrent ? '#0891b2' : '#ffffff'}" stroke-width="${isCurrent ? 3 : 2}" class="${isCurrent ? 'animate-pulse' : ''}" />
                                                    <text x="${coords.x}" y="${coords.y + 4}" text-anchor="middle" font-size="${isCurrent ? 14 : 12}" font-weight="900" fill="${textColor}">${item.letter}</text>
                                                </g>
                                            `;
                                        }).join('')}
                                    </svg>
                                </div>
                            </div>

                            <div class="lg:col-span-7 flex flex-col gap-6">
                                <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-md flex flex-col gap-6">
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                                        <span class="bg-indigo-50 text-indigo-700 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">${currentItem ? currentItem.type : ''}</span>
                                        <button onclick="state.roscoState='intro'; render();" class="text-xs font-bold text-slate-400">❌ Salir</button>
                                    </div>

                                    <div class="bg-slate-50 border border-slate-100 p-5 rounded-2xl">
                                        <p class="text-base font-bold text-slate-800 leading-relaxed">"${currentItem ? currentItem.prompt : ''}"</p>
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        ${(currentItem ? currentItem.options : []).map((opt) => `
                                            <button onclick="handleRoscoOptionSelect('${opt}')" class="p-4 rounded-2xl border-2 border-slate-200 hover:border-indigo-500 hover:bg-indigo-50/50 text-left font-extrabold text-sm text-slate-800 transition-all flex items-center justify-between group shadow-sm">
                                                <span>${opt}</span>
                                                <span class="text-slate-300 group-hover:text-indigo-600 transition-transform group-hover:translate-x-1">➡️</span>
                                            </button>
                                        `).join('')}
                                    </div>

                                    <button onclick="handleRoscoSkip()" class="w-full py-3.5 bg-amber-400 text-amber-950 font-black text-xs rounded-2xl shadow-md">🟡 PASAPALABRA (Saltar Letra)</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (state.roscoState === "summary") {
                    html += `
                        <div class="flex flex-col gap-8 animate-fadeIn max-w-4xl mx-auto">
                            <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-100 shadow-xl text-center flex flex-col items-center gap-6">
                                <div class="bg-indigo-50 text-indigo-600 p-4 rounded-full text-3xl">🏆</div>
                                <h2 class="text-2xl font-black text-slate-900">¡Rosco Finalizado!</h2>
                                <button onclick="initRoscoGame(state.roscoSpecialtyFilter)" class="px-8 py-3 bg-indigo-600 text-white font-extrabold text-xs rounded-2xl">Jugar Nuevo Rosco 🔄</button>
                            </div>
                        </div>
                    `;
                }
            }

            // SIMULATOR ACTIVE QUESTION / AUDIT
            if (state.activeTab === "simulator" && state.view === "simulator") {
                const q = state.questions[state.currentIdx];
                const hasSelected = !!state.selectedAnswers[state.currentIdx];
                const hasSubmitted = !!state.submitted[state.currentIdx];
                const userSel = state.selectedAnswers[state.currentIdx];

                html += `
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-fadeIn">
                        <div class="lg:col-span-7 flex flex-col gap-6">
                            <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100">
                                <div class="flex justify-between items-center mb-6">
                                    <span class="bg-blue-50 text-blue-700 text-xs font-extrabold px-3 py-1 rounded-full uppercase">Pregunta ${state.currentIdx + 1} de ${state.questions.length}</span>
                                    <button onclick="stopDiagTimer(); state.view='dashboard'; render();" class="text-xs font-bold text-slate-400">❌ Volver al Panel</button>
                                </div>

                                <div class="bg-slate-50 border border-slate-100 p-5 rounded-2xl mb-6">
                                    <span class="text-[10px] font-bold uppercase text-slate-400 block mb-1">Área: ${specialtyLabels[state.selectedSpecialty] || q.area}</span>
                                    <h3 class="text-base md:text-lg font-extrabold text-slate-900 leading-relaxed">${q.question}</h3>
                                </div>

                                <div class="flex flex-col gap-3">
                                    ${q.options.map(opt => {
                                        const isSel = userSel === opt.id;
                                        const isCorr = opt.id === q.correctAnswer;
                                        let cls = "border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-800";
                                        let badgeCls = "bg-slate-100 text-slate-600";

                                        if (isSel && !hasSubmitted) {
                                            cls = "border-blue-500 bg-blue-50 text-blue-900 ring-2 ring-blue-500/20";
                                            badgeCls = "bg-blue-600 text-white";
                                        } else if (hasSubmitted) {
                                            if (isCorr) {
                                                cls = "border-emerald-500 bg-emerald-50 text-emerald-950 font-medium";
                                                badgeCls = "bg-emerald-600 text-white";
                                            } else if (isSel) {
                                                cls = "border-rose-300 bg-rose-50 text-rose-950";
                                                badgeCls = "bg-rose-600 text-white";
                                            } else {
                                                cls = "border-slate-100 bg-white text-slate-400 opacity-60 pointer-events-none";
                                            }
                                        }

                                        return `
                                            <button onclick="handleSelectOption('${opt.id}')" ${hasSubmitted ? 'disabled' : ''} class="flex items-start text-left p-4 rounded-2xl border-2 transition-all gap-4 ${cls}">
                                                <span class="w-8 h-8 rounded-xl border flex items-center justify-center font-bold text-sm ${badgeCls}">${opt.id}</span>
                                                <span class="text-sm md:text-base pt-0.5 leading-relaxed">${opt.text}</span>
                                            </button>
                                        `;
                                    }).join('')}
                                </div>

                                <div class="flex justify-between items-center mt-8 pt-6 border-t border-slate-100">
                                    <button onclick="handlePrev()" ${state.currentIdx === 0 ? 'disabled' : ''} class="px-4 py-2 text-sm font-bold text-slate-600 ${state.currentIdx === 0 ? 'opacity-30' : 'hover:bg-slate-100'}">◀️ Atrás</button>
                                    ${!hasSubmitted ? `
                                        <button onclick="handleSubmitAnswer()" ${!hasSelected ? 'disabled' : ''} class="px-6 py-3 text-sm font-bold rounded-2xl ${hasSelected ? 'bg-blue-600 text-white hover:bg-blue-700 shadow-lg' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">Comprobar Conducta 🩺</button>
                                    ` : `
                                        <button onclick="handleNext()" class="px-6 py-3 text-sm font-bold bg-slate-900 text-white rounded-2xl hover:bg-slate-800 shadow-lg">${state.currentIdx < state.questions.length - 1 ? 'Siguiente Caso ➡️' : 'Finalizar Simulacro 🏆'}</button>
                                    `}
                                </div>
                            </div>
                        </div>

                        <div class="lg:col-span-5">
                            ${!hasSubmitted ? `
                                <div class="bg-slate-100/70 border border-dashed border-slate-200 rounded-3xl p-8 flex flex-col items-center justify-center text-center h-full min-h-[300px]">
                                    <div class="bg-blue-50 text-blue-600 p-4 rounded-2xl mb-4">💡</div>
                                    <h4 class="font-extrabold text-slate-800 text-lg">Panel de Auditoría de Error</h4>
                                </div>
                            ` : `
                                <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-slate-100 flex flex-col gap-5 animate-fadeIn">
                                    <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                                        <span class="text-emerald-500 text-xl">🛡️</span>
                                        <h4 class="font-extrabold text-slate-900 uppercase tracking-tight text-xs">Análisis Técnico EUNACOM</h4>
                                    </div>
                                    <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 text-xs">
                                        <p class="font-extrabold text-blue-900 mb-1">Alternativa ${q.correctAnswer}:</p>
                                        <p class="text-slate-600 leading-relaxed">${q.justification}</p>
                                    </div>
                                    <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-2xl p-4">
                                        <p class="text-xs font-semibold whitespace-pre-line text-amber-950">${q.pearl}</p>
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>
                `;
            } 
            else if (state.activeTab === "simulator" && state.view === "finished") {
                html += `
                    <div class="max-w-xl mx-auto bg-white rounded-3xl p-8 shadow-lg border border-slate-100 text-center flex flex-col items-center gap-6 animate-fadeIn my-12">
                        <div class="bg-blue-50 text-blue-600 p-5 rounded-full text-3xl">🏆</div>
                        <h2 class="text-2xl font-black text-slate-900">¡Desafío Finalizado!</h2>
                        <p class="text-xs text-slate-500">Se han acreditado tus puntos de experiencia en tu perfil.</p>
                        <button onclick="stopDiagTimer(); state.view='dashboard'; render();" class="w-full py-4 bg-slate-950 text-white font-bold rounded-2xl">Volver al Dashboard Principal</button>
                    </div>
                `;
            }

            app.innerHTML = html;

            if (state.activeTab === "diag_minuto" && state.diagState === "playing") {
                updateTimerUI();
            }
        }

        // Renderizado inicial
        render();
    </script>
</body>
</html>
